name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  clj:
    name: Clojure tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Clojure
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: '1.12.0.1530'
      - name: Cache Clojure deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.clojure
            ~/.cpcache
          key: ${{ runner.os }}-clj-${{ hashFiles('**/deps.edn') }}
          restore-keys: ${{ runner.os }}-clj-
      - name: Run tests
        run: make tests

  bb:
    name: Babashka tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup babashka
        uses: DeLaGuardo/setup-clojure@13.4
        with:
          # Pin the version: `bb: 'latest'` resolves the newest release via the GitHub API at job
          # start and intermittently fails ("Can't obtain latest Babashka version") on rate limits.
          bb: '1.12.218'
      - name: Cache babashka deps
        uses: actions/cache@v4
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
          key: ${{ runner.os }}-bb-${{ hashFiles('**/bb.edn') }}
          restore-keys: ${{ runner.os }}-bb-
      - name: Run babashka-compatible tests
        run: make bb-tests
